<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Arial, sans-serif">
<title id="t">WordWorld pipeline</title><desc id="d">A sentence, with client context for &#x27;it&#x27; and &#x27;them&#x27;, passes through clause splitting and rule grammar, then grounding into ordered action JSON, then the scene. spaCy annotations explain but never decide; typo suggestions appear only when a re-parse is measurably better; a dependency baseline is shown for comparison and never applied.</desc>
<rect width="980" height="330" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d3244"/></marker></defs>
<text x="30" y="28" font-size="15" fill="#2d3244" text-anchor="start" font-weight="700">WordWorld pipeline: a sentence becomes ordered, inspectable actions</text>
<rect x="30" y="70" width="150" height="70" rx="10" fill="#f3efff" stroke="#7657cb" stroke-width="1.5"/>
<text x="105.0" y="96" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">Sentence</text>
<text x="105.0" y="113" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">+ what “it” means</text>
<text x="105.0" y="130" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">(client context)</text>
<rect x="225" y="70" width="170" height="70" rx="10" fill="#fff7e6" stroke="#d99a3d" stroke-width="1.5"/>
<text x="310.0" y="96" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">Clause splitting</text>
<text x="310.0" y="113" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">+ grammar</text>
<text x="310.0" y="130" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">(rules, regexes)</text>
<rect x="440" y="70" width="170" height="70" rx="10" fill="#fff7e6" stroke="#d99a3d" stroke-width="1.5"/>
<text x="525.0" y="96" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">Grounding</text>
<text x="525.0" y="113" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">add · remove · recolor</text>
<text x="525.0" y="130" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">resize · move · settings</text>
<rect x="655" y="70" width="140" height="70" rx="10" fill="#eaf6ee" stroke="#5aa777" stroke-width="1.5"/>
<text x="725.0" y="96" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">Action JSON</text>
<text x="725.0" y="113" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">(ordered, exact)</text>
<rect x="840" y="70" width="110" height="70" rx="10" fill="#eaf6ee" stroke="#5aa777" stroke-width="1.5"/>
<text x="895.0" y="96" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">Scene</text>
<text x="895.0" y="113" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">placement</text>
<text x="895.0" y="130" font-size="12" fill="#2d3244" text-anchor="middle" font-weight="400">+ undo</text>
<line x1="180" y1="105" x2="225" y2="105" stroke="#2d3244" stroke-width="1.6"  marker-end="url(#a)"/>
<line x1="395" y1="105" x2="440" y2="105" stroke="#2d3244" stroke-width="1.6"  marker-end="url(#a)"/>
<line x1="610" y1="105" x2="655" y2="105" stroke="#2d3244" stroke-width="1.6"  marker-end="url(#a)"/>
<line x1="795" y1="105" x2="840" y2="105" stroke="#2d3244" stroke-width="1.6"  marker-end="url(#a)"/>
<rect x="225" y="200" width="170" height="64" rx="10" fill="#eef3ff" stroke="#5a7fcf" stroke-width="1.5"/>
<text x="310" y="226" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">spaCy annotations</text>
<text x="310" y="244" font-size="11.5" fill="#2d3244" text-anchor="middle" font-weight="400">tokens · POS · dependencies</text>
<line x1="310" y1="200" x2="310" y2="142" stroke="#2d3244" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="318" y="176" font-size="10.5" fill="#6b6f86" text-anchor="start" font-weight="400">explains, never decides</text>
<rect x="440" y="200" width="170" height="64" rx="10" fill="#fdeeee" stroke="#cf6f6f" stroke-width="1.5"/>
<text x="525" y="226" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">“Did you mean…?”</text>
<text x="525" y="244" font-size="11.5" fill="#2d3244" text-anchor="middle" font-weight="400">edit distance + re-parse</text>
<line x1="525" y1="200" x2="525" y2="142" stroke="#2d3244" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="533" y="176" font-size="10.5" fill="#6b6f86" text-anchor="start" font-weight="400">only if measurably better</text>
<rect x="655" y="200" width="295" height="64" rx="10" fill="#f2f2f7" stroke="#a9a7b8" stroke-width="1.5"/>
<text x="802" y="226" font-size="13" fill="#2d3244" text-anchor="middle" font-weight="700">Dependency baseline (comparison only)</text>
<text x="802" y="244" font-size="11" fill="#2d3244" text-anchor="middle" font-weight="400">reads the same actions from spaCy arcs · never applied</text>
<text x="30" y="312" font-size="10.5" fill="#6b6f86" text-anchor="start" font-weight="400">Solid arrows drive the world. Dashed arrows are explanations or suggestions that a person can ignore.</text>
</svg>
