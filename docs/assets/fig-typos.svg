<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Arial, sans-serif">
<title id="t">Typo robustness</title><desc id="d">Rules alone 38/524; with the suggestion applied 523/524.</desc>
<rect width="880" height="210" fill="#ffffff"/>
<text x="40" y="28" font-size="15" fill="#2d3244" text-anchor="start" font-weight="700">One typo in a vocabulary word: exact match on 530 commands</text>
<text x="40" y="46" font-size="11" fill="#6b6f86" text-anchor="start" font-weight="400">Seed 4 was never inspected. Whiskers are 95% Wilson intervals.</text>
<line x1="230.0" y1="64" x2="230.0" y2="150" stroke="#e4e2ee"/>
<text x="230.0" y="166" font-size="10" fill="#6b6f86" text-anchor="middle" font-weight="400">0%</text>
<line x1="314.0" y1="64" x2="314.0" y2="150" stroke="#e4e2ee"/>
<text x="314.0" y="166" font-size="10" fill="#6b6f86" text-anchor="middle" font-weight="400">20%</text>
<line x1="398.0" y1="64" x2="398.0" y2="150" stroke="#e4e2ee"/>
<text x="398.0" y="166" font-size="10" fill="#6b6f86" text-anchor="middle" font-weight="400">40%</text>
<line x1="482.0" y1="64" x2="482.0" y2="150" stroke="#e4e2ee"/>
<text x="482.0" y="166" font-size="10" fill="#6b6f86" text-anchor="middle" font-weight="400">60%</text>
<line x1="566.0" y1="64" x2="566.0" y2="150" stroke="#e4e2ee"/>
<text x="566.0" y="166" font-size="10" fill="#6b6f86" text-anchor="middle" font-weight="400">80%</text>
<line x1="650.0" y1="64" x2="650.0" y2="150" stroke="#e4e2ee"/>
<text x="650.0" y="166" font-size="10" fill="#6b6f86" text-anchor="middle" font-weight="400">100%</text>
<text x="218" y="89" font-size="12" fill="#2d3244" text-anchor="end" font-weight="400">Rules alone</text>
<rect x="230" y="76" width="30.5" height="20" fill="#d99a3d"/>
<line x1="252.4" y1="86" x2="271.2" y2="86" stroke="#2d3244" stroke-width="1.5"/>
<text x="662" y="90" font-size="12" fill="#2d3244" text-anchor="start" font-weight="400">38/524 (7.3%)</text>
<text x="218" y="129" font-size="12" fill="#2d3244" text-anchor="end" font-weight="400">Rules + “Did you mean” applied</text>
<rect x="230" y="116" width="419.2" height="20" fill="#5aa777"/>
<line x1="645.5" y1="126" x2="649.9" y2="126" stroke="#2d3244" stroke-width="1.5"/>
<text x="662" y="130" font-size="12" fill="#2d3244" text-anchor="start" font-weight="400">523/524 (99.8%)</text>
<text x="40" y="194" font-size="10.5" fill="#6b6f86" text-anchor="start" font-weight="400">Chosen to stress the system: every command carries a typo in a word the grammar needs. The app only shows a suggestion; it never applies one.</text>
</svg>
