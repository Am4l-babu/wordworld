[project]
name = "wordworld"
version = "1.0.0"
description = "An explainable natural-language world builder with React and FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "spacy==3.8.16",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
app = "backend.main:app"
